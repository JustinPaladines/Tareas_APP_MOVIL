<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Ruta Destinada: Universidad a Parque</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Generar Enlace de Ruta</ion-card-title>
    </ion-card-header>
    <ion-card-content>

      <!-- boton para generar el enlace de la ruta -->
      <ion-button color="secondary" expand="block" (click)="generarRuta()">
        Generar Ruta
      </ion-button>

      <!-- url de la ruta creada se muestra -->
      <div *ngIf="urlRuta" class="ion-margin-top">
        <p><strong>Enlace de la Ruta:</strong></p>

        <!-- Hipervínculo de la ruta -->
        <a [href]="urlRuta" target="_blank">{{ urlRuta }}</a>

        <!-- bootn para guardar en TXT -->
        <ion-button color="success" expand="block" class="ion-margin-top" (click)="guardarRutaTxt()">
          Guardar Ruta (.txt)
        </ion-button>
      </div>

    </ion-card-content>
  </ion-card>
</ion-content>
