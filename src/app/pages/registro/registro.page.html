
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="contenedor">

    <div class="encabezado">
      <h1>¡Únete a ConnectChat!</h1>
      <p>Crea tu cuenta para comenzar a conversar.</p>
    </div>

    <div class="campo">
      <ion-label>Nombre completo</ion-label>
      <ion-item>
        <ion-input
          type="text"
          placeholder="Ej. Juan Pérez"
          [(ngModel)]="nombre">
        </ion-input>
      </ion-item>
    </div>

    <div class="campo">
      <ion-label>Correo electrónico</ion-label>
      <ion-item>
        <ion-input
          type="email"
          placeholder="Ej. correo@gmail.com"
          [(ngModel)]="email">
        </ion-input>
      </ion-item>
    </div>

    <div class="campo">
      <ion-label>Contraseña</ion-label>
      <ion-item>
        <ion-input
          type="password"
          placeholder="Escribe tu contraseña"
          [(ngModel)]="password">
        </ion-input>
      </ion-item>
    </div>

    <div class="campo">
      <ion-label>Confirmar contraseña</ion-label>
      <ion-item>
        <ion-input
          type="password"
          placeholder="Repite tu contraseña"
          [(ngModel)]="confirmarPassword">
        </ion-input>
      </ion-item>
    </div>

    <ion-button
      expand="block"
      class="boton"
      (click)="registrar()"
      [disabled]="cargando">

      {{ cargando ? 'Registrando...' : 'Crear cuenta' }}

    </ion-button>

    <ion-text color="danger" *ngIf="mensaje">
      <p class="mensaje">{{ mensaje }}</p>
    </ion-text>

    <div class="enlace">
      <p>¿Ya tienes una cuenta?</p>
      <ion-button routerLink="/login">
        Iniciar sesión
      </ion-button>
    </div>

  </div>
</ion-content>
