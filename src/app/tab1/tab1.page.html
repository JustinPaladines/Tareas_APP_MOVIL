<ion-header [translucent]="true">
  <ion-toolbar class="purple-toolbar">
    <ion-title> FotoIonic - Paladines Justin </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar class="purple-toolbar">
      <ion-title size="large">¡PREPARA TU FACE!</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.filepath; let position = $index) {
      <ion-col size="6">
        <img [src]="photo.webviewPath" [attr.alt]="'Photo ' + (position + 1)" loading="lazy" (click)="showActionSheet(photo, position)" />
      </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- El mensaje se oculta automáticamente cuando tomas la primera foto -->
  @if (photoService.photos().length === 0) {
    <div class="mensajito">
      <h1><strong>PREPARA TU FACE</strong></h1>
    </div>
  }

</ion-content>
