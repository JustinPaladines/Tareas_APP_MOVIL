
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Tienda de Justin - Compra</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Datos</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">Nombre del producto</ion-label>
        <ion-input
          [(ngModel)]="producto"
          placeholder="Ejemplo: Compu Gamer"
          type="text">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Cantidad</ion-label>
        <ion-input
          [(ngModel)]="cantidad"
          type="number"
          min="1"
          step="1"
          placeholder="Ejemplo: 7">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Precio unitario</ion-label>
        <ion-input
          [(ngModel)]="precio"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="Ejemplo: 15.50">
        </ion-input>
      </ion-item>

      <ion-card color="light">
        <ion-card-content>
          <ion-text color="dark">
            <h2>
              <strong>Subtotal: {{ subtotal | number:'1.2-2' }} $</strong>
            </h2>
          </ion-text>
        </ion-card-content>
      </ion-card>

      <ion-button
        expand="block"
        (click)="registrarCompra()">
        Continuar al pago
      </ion-button>

    </ion-card-content>
  </ion-card>
</ion-content>
